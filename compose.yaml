services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      AI_MODE: ${AI_MODE:-mock}
      AI_ENABLED: ${AI_ENABLED:-true}
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      BASETEN_BASE_URL: ${BASETEN_BASE_URL:-https://inference.baseten.co/v1}
      BASETEN_MODEL: ${BASETEN_MODEL:-meta-models/muse-spark-open-1026}
      META_MODEL_API_KEY: ${META_MODEL_API_KEY:-}
      META_BASE_URL: ${META_BASE_URL:-https://api.meta.ai/v1}
      META_MODEL: ${META_MODEL:-}
      MAX_AGENT_CALLS_PER_MINUTE: ${MAX_AGENT_CALLS_PER_MINUTE:-12}
      MAX_EVENT_BATCH_SIZE: ${MAX_EVENT_BATCH_SIZE:-20}
      AGENT_FLUSH_INTERVAL_MS: ${AGENT_FLUSH_INTERVAL_MS:-5000}
      CASINO_BRAIN_COOLDOWN_MS: ${CASINO_BRAIN_COOLDOWN_MS:-15000}
      MAX_INVESTIGATION_TURNS: ${MAX_INVESTIGATION_TURNS:-4}
      MAX_INVESTIGATION_TOOL_CALLS: ${MAX_INVESTIGATION_TOOL_CALLS:-6}
      INVESTIGATION_TIMEOUT_MS: ${INVESTIGATION_TIMEOUT_MS:-25000}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
